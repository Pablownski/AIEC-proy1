name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  frontend-quality:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @agichat/chat-widget
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace @agichat/chat-widget
      - run: npm run typecheck --workspace apps/web

  backend-quality:
    name: Backend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  frontend-tests:
    name: Frontend tests & coverage
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace @agichat/chat-widget

  backend-tests:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/web

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [build, backend-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: npm ci
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Start backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
        working-directory: apps/api
      - name: Start frontend
        run: nohup npm run start -- -p 3000 > /tmp/frontend.log 2>&1 &
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Wait for services
        run: npx wait-on -t 60000 http-get://localhost:8000/api/v1/health http://localhost:3000
      - run: npm run e2e
      - name: Show server logs
        if: always()
        run: |
          echo "--- backend log ---"; cat /tmp/backend.log || true
          echo "--- frontend log ---"; cat /tmp/frontend.log || true
