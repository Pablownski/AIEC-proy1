services:
  api:
    build:
      context: ./apps/api
    # Runtime configuration is loaded only into api, never interpolated from AGENT_PROVIDER.
    env_file:
      - ./apps/api/.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - CORS_ORIGINS=http://localhost:${WEB_PORT:-3000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/chat-widget:/app/packages/chat-widget
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/chat-widget/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${API_PORT:-8000}/ws/chat
      - WATCHPACK_POLLING=true
    depends_on:
      - api
