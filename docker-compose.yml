services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:${WEB_PORT:-3000}
      - MOCK_AGENT_DELAY_SECONDS=0.4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/chat-widget/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${API_PORT:-8000}/ws/chat
      - WATCHPACK_POLLING=true
    depends_on:
      - api
